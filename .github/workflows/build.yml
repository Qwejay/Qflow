name: Build and Release Qflow

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如：3.0.0 或 3.0.1-beta）'
        required: true
        default: '3.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Resolve Version and Release Tag
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$REF_NAME"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$INPUT_VERSION"
            if [[ ! "$RELEASE_TAG" =~ ^[vV] ]]; then
              RELEASE_TAG="v$RELEASE_TAG"
            fi
          else
            echo "Unsupported trigger for release." >&2
            exit 1
          fi

          CLEAN_VER="${RELEASE_TAG#v}"
          CLEAN_VER="${CLEAN_VER#V}"

          # 接受 x.y、x.y.z、x.y.z.w，以及可选的预发布/构建标识。
          if [[ ! "$CLEAN_VER" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $CLEAN_VER" >&2
            exit 1
          fi

          METADATA_VER="${CLEAN_VER%%-*}"
          METADATA_VER="${METADATA_VER%%+*}"
          IS_PRERELEASE=false
          [[ "$CLEAN_VER" == *-* ]] && IS_PRERELEASE=true

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "clean_version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "metadata_version=$METADATA_VER" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          echo "Release tag: $RELEASE_TAG"
          echo "Application version: $CLEAN_VER"
          echo "Windows metadata version: $METADATA_VER"
          echo "Prerelease: $IS_PRERELEASE"

      - name: Sync Version to Code
        shell: python
        env:
          QFLOW_VERSION: ${{ steps.version.outputs.clean_version }}
        run: |
          import os
          import re

          version = os.environ["QFLOW_VERSION"]
          candidates = [name for name in ("Qflow.py", "main.py") if os.path.isfile(name)]
          if not candidates:
              raise SystemExit("未找到 Qflow.py 或 main.py，无法同步版本号。")

          for filename in candidates:
              with open(filename, "r", encoding="utf-8") as file:
                  content = file.read()

              updated, count = re.subn(
                  r'(__version__\s*=\s*["\'])[^"\']+(["\'])',
                  lambda match: match.group(1) + version + match.group(2),
                  content,
                  count=1,
              )
              if count:
                  with open(filename, "w", encoding="utf-8", newline="") as file:
                      file.write(updated)
                  print(f"已同步 {filename}: {version}")

      - name: Build with Nuitka
        shell: pwsh
        env:
          QFLOW_VERSION: ${{ steps.version.outputs.clean_version }}
          METADATA_VERSION: ${{ steps.version.outputs.metadata_version }}
        run: |
          $version = $env:QFLOW_VERSION
          $metadataVersion = $env:METADATA_VERSION

          if (Test-Path "Qflow.py") {
              $entryPoint = "Qflow.py"
              $expectedExe = "dist/Qflow.exe"
          } elseif (Test-Path "main.py") {
              $entryPoint = "main.py"
              $expectedExe = "dist/main.exe"
          } else {
              throw "未找到入口文件 Qflow.py 或 main.py。"
          }

          $nuitkaParams = @(
            "-m", "nuitka",
            "--standalone",
            "--onefile",
            "--windows-console-mode=disable",
            "--enable-plugin=tk-inter",
            "--product-name=Qflow",
            "--product-version=$metadataVersion",
            "--file-description=Qflow Application",
            "--output-dir=dist",
            "--clean-cache=all",
            "--remove-output",
            "--noinclude-unittest-mode=nofollow",
            "--noinclude-pytest-mode=nofollow",
            "--noinclude-setuptools-mode=nofollow",
            "--assume-yes-for-downloads"
          )

          if (Test-Path "icon.ico") {
            $nuitkaParams += "--windows-icon-from-ico=icon.ico"
            $nuitkaParams += "--include-data-files=icon.ico=icon.ico"
          }

          $nuitkaParams += $entryPoint
          python @nuitkaParams
          if ($LASTEXITCODE -ne 0) {
              throw "Nuitka 编译失败，退出代码：$LASTEXITCODE"
          }

          if (-not (Test-Path $expectedExe)) {
              throw "编译完成但未找到预期产物：$expectedExe"
          }

          $outputExe = "dist/Qflow_$version.exe"
          $outputZip = "dist/Qflow_$version.zip"
          if (Test-Path $outputExe) { Remove-Item $outputExe -Force }
          if (Test-Path $outputZip) { Remove-Item $outputZip -Force }

          Rename-Item -Path $expectedExe -NewName (Split-Path $outputExe -Leaf)
          Compress-Archive -Path $outputExe -DestinationPath $outputZip -Force

          if (-not (Test-Path $outputZip)) {
              throw "ZIP 归档生成失败：$outputZip"
          }
          Write-Host "成功生成：$outputExe"
          Write-Host "成功生成：$outputZip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qflow-executable-${{ steps.version.outputs.clean_version }}
          path: dist/Qflow_*.zip
          if-no-files-found: error
          retention-days: 5

      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $latestCommit = git log -1 --pretty=format:"- %s (%h)" $env:GITHUB_SHA
          "changelog<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $latestCommit | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Qflow ${{ steps.version.outputs.clean_version }}
          body: |
            ## Latest Change

            ${{ steps.changelog.outputs.changelog }}

            ---
            *此版本由 GitHub Actions 自动构建生成。*
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/Qflow_*.zip
          fail_on_unmatched_files: true
